services:
  postgres-demonstration:
    # The official postgres image with the demonstration database dump baked in and loaded on first start:
    #   https://hub.docker.com/r/onacit/postgresql-demodb      (also ghcr.io/jinahya/postgresql-demodb)
    #   https://github.com/jinahya/postgresql-demodb-docker
    # Tags are <postgres>-<base>-<dump date>-<edition>. This is the smallest one: PostgreSQL 18 on Alpine with the
    # 3m edition (three months of flights), about 260 MB to pull. The other editions are 6m, 1y and 2y; `18-3m`
    # is the same dump on Debian.
    image: onacit/postgresql-demodb:18-alpine-3m
    container_name: postgres-demonstration
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      # POSTGRES_DB is left at its default, `postgres`: the image's init script runs connected to it, and the dump
      # drops and recreates `demo`, which it could not do while connected to `demo`
    healthcheck:
      # -d demo: the entrypoint accepts outside connections only after the init script, so this is green
      # only once the dump is loaded. About a minute for the 3m edition (1.3 GB of tables and indexes once
      # loaded), and the bigger editions take correspondingly longer -- hence the budget of 5s x 240 = 20 minutes.
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "demo" ]
      interval: 5s
      timeout: 5s
      retries: 240
