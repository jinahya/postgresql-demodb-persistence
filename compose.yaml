services:
  postgres-demonstration:
    # The official postgres image with the demonstration database dump baked in and loaded on first start:
    #   https://hub.docker.com/r/onacit/postgresql-demodb      (also ghcr.io/jinahya/postgresql-demodb)
    #   https://github.com/jinahya/postgresql-demodb-docker
    # Tags are <postgres>-<base>-<dump date>-<edition>. This is the smallest one: PostgreSQL 18 on Alpine with the
    # 3m edition (three months of flights), about 260 MB to pull. The other editions are 6m, 1y and 2y; `18-3m`
    # is the same dump on Debian.
    image: onacit/postgresql-demodb:18-alpine-3m
    container_name: postgresql-demodb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      # POSTGRES_DB is left at its default, `postgres`: the image's init script runs connected to it, and the dump
      # drops and recreates `demo`, which it could not do while connected to `demo`
    healthcheck:
      # -d demo: the entrypoint accepts outside connections only after the init script, so this is green
      # only once the dump is loaded. About a minute for the 3m edition (1.3 GB of tables and indexes once
      # loaded), and the bigger editions take correspondingly longer -- hence the budget of 5s x 240 = 20 minutes.
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "demo" ]
      interval: 5s
      timeout: 5s
      retries: 240

  pgadmin:
    # https://hub.docker.com/r/dpage/pgadmin4 -- http://localhost:5050, log in as postgres@example.com / password
    # (pgAdmin insists on an e-mail address for its own login). The demo server is registered on first start from
    # the servers.json below, with its password read from the pgpass below, so it connects without being asked.
    image: dpage/pgadmin4:9
    container_name: postgresql-demodb-pgadmin
    depends_on:
      postgres-demonstration:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@example.com
      PGADMIN_DEFAULT_PASSWORD: password
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
      - source: pgadmin-pgpass
        target: /pgadmin4/pgpass.src
    # pgAdmin looks the password file up inside the user's storage directory, and libpq ignores one that is
    # readable by others, so the file is copied there with the right mode before the regular entrypoint runs
    entrypoint: [ "/bin/sh", "-c", "d=/var/lib/pgadmin/storage/postgres_example.com && mkdir -p -m 700 $$d && cp /pgadmin4/pgpass.src $$d/pgpass && chmod 600 $$d/pgpass && exec /entrypoint.sh" ]

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "postgresql-demodb",
            "Group": "Servers",
            "Host": "postgres-demonstration",
            "Port": 5432,
            "MaintenanceDB": "demo",
            "Username": "postgres",
            "PassFile": "/pgpass",
            "SSLMode": "prefer"
          }
        }
      }
  pgadmin-pgpass:
    content: |
      postgres-demonstration:5432:*:postgres:password
