# Registry of the exercises in EXERCISES.asciidoc and src/test/sql/*_exercises_*.sql.
#
# An id is DEMODB-<SECTION>-<TIER>-<NN>: the table or view the exercise reads alone, or SCHEMA for one that reads more
# than one, the tier (B for Basic, I for Intermediate, A for Advanced), and a number within that section and tier.
#
# Ids are permanent. A new exercise takes the next unused number of its section and tier; an exercise that moves or
# changes tier keeps its id; an id of a removed exercise is marked `retired: true` and never reused. EXERCISES.asciidoc
# carries each id as the anchor and the prefix of the exercise's heading, and the .sql file repeats it in the marker
# above the statement.
#
# `sql` is the file that answers the exercise in SQL. `test`, the integration test and its nested class that answer it
# in JPQL and with the Criteria API, is added with the class, once the entities exist; an exercise only SQL can answer
# is flagged `native-only: true`.

